name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job checks weftbase out into ./weftbase and weft's main beside
# it (.github/actions/workspace writes the go.work joining them) until
# weft is tagged under github.com/weftbase/weft. WEFT_CHECKOUT_TOKEN
# reads weftbase/weft while it is private.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      - name: vet
        working-directory: weftbase
        run: go vet ./...
      - name: test
        working-directory: weftbase
        run: go test -race -timeout 20m ./...
      - name: build
        working-directory: weftbase
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      # Pinned as weft's lint job pins it.
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
      - name: lint
        working-directory: weftbase
        run: golangci-lint run

  # The gated ClickHouse suite (obsdb/clickhouse's README "CI job
  # (service container)" block): the conformance table and the
  # collector-shape insert test need a server; each test creates and
  # drops its own database. The same DSN also un-gates cmd/weftbase's
  # hosted-backend test. A gated test that skips fails the job — a DSN
  # the tests cannot read must not turn it green.
  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_PASSWORD: weft
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password weft --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEFT_CLICKHOUSE_DSN: clickhouse://default:weft@127.0.0.1:9000/default
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      - name: test (obsdb/clickhouse, gated suite)
        working-directory: weftbase/obsdb/clickhouse
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 30m -v ./... | tee "$RUNNER_TEMP/clickhouse.log"
          if grep -E '^\s*--- SKIP' "$RUNNER_TEMP/clickhouse.log"; then
            echo "gated tests skipped: WEFT_CLICKHOUSE_DSN did not reach them" >&2
            exit 1
          fi
      - name: test (cmd/weftbase, gated --db clickhouse:// test)
        working-directory: weftbase/cmd/weftbase
        run: |
          set -o pipefail
          go test -race -count=1 -v -run '^TestNewServerClickhouse$' ./... | tee "$RUNNER_TEMP/weftbase-cmd.log"
          grep -q -- '--- PASS: TestNewServerClickhouse' "$RUNNER_TEMP/weftbase-cmd.log"

  # The offline gate: the whole module stays green under
  # WEFT_MODEL_REQUESTS=deny.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      - name: test (WEFT_MODEL_REQUESTS=deny)
        working-directory: weftbase
        run: WEFT_MODEL_REQUESTS=deny go test ./...

  # The studio freshness gate (ADR 0018 §4): rebuild the web app, prove
  # the committed studio/dist matches byte for byte and fits the 800 KiB
  # gzip budget, then run the web typecheck and tests. Bun is pinned to
  # the version the committed dist was built with; Go and the workspace
  # are there because the panel's version stamp is read from the weft
  # module (studio/web/scripts/weft-version.ts).
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: make studio-check
        working-directory: weftbase
        run: make studio-check

  # The phase 3 gate's first clause (Makefile devtools-vite-check): the
  # packed @weftgo/devtools in a real Vite app, built and smoke-tested
  # in jsdom.
  devtools-vite:
    runs-on: ubuntu-latest
    needs: studio
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: make studio-build
        working-directory: weftbase
        run: make studio-build
      - name: make devtools-vite-check
        working-directory: weftbase
        run: make devtools-vite-check
