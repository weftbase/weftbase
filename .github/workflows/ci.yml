name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

permissions:
  contents: read

# Every job checks weftbase out into ./weftbase and weft's main beside
# it (.github/actions/workspace); the committed go.work joins the server
# module, the client module and ../weft until weft is tagged under
# github.com/weftbase/weft. WEFT_CHECKOUT_TOKEN reads weftbase/weft
# while it is private.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
            weft/**/go.sum
      - name: build (both modules)
        working-directory: weftbase
        run: make build
      - name: vet (both modules)
        working-directory: weftbase
        run: make vet
      - name: test (both modules)
        working-directory: weftbase
        run: make test

  # The layering check, the client module's dependency allow-list and
  # the Go vocabulary audit (docs/architecture.md). Each fails on its
  # own seeded violation in scripts/layering's tests.
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
            weft/**/go.sum
      - name: layering
        working-directory: weftbase
        run: make layering
      - name: client module dependencies
        working-directory: weftbase
        run: make client-deps
      - name: vocabulary
        working-directory: weftbase
        run: make vocab
      - name: layering check's own tests
        working-directory: weftbase
        run: go test ./scripts/layering/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
            weft/**/go.sum
      # Pinned as weft's lint job pins it.
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
      - name: lint
        working-directory: weftbase
        run: make lint

  # The gated ClickHouse suite (obsdb/clickhouse's README "CI job
  # (service container)"): the conformance table and the collector-shape
  # insert test need a server; each test creates and drops its own
  # database. A gated test that skips fails the job: a DSN the tests
  # cannot read must not turn it green.
  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_PASSWORD: weft
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password weft --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEFT_CLICKHOUSE_DSN: clickhouse://default:weft@127.0.0.1:9000/default
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weft/**/go.sum
      - name: test (obsdb/clickhouse, gated suite)
        working-directory: weftbase/obsdb/clickhouse
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 30m -v ./... | tee "$RUNNER_TEMP/clickhouse.log"
          if grep -E '^\s*--- SKIP' "$RUNNER_TEMP/clickhouse.log"; then
            echo "gated tests skipped: WEFT_CLICKHOUSE_DSN did not reach them" >&2
            exit 1
          fi

  # The offline gate: both modules stay green under
  # WEFT_MODEL_REQUESTS=deny.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: ./weftbase/.github/actions/workspace
        with:
          token: ${{ secrets.WEFT_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
            weft/**/go.sum
      - name: test (WEFT_MODEL_REQUESTS=deny)
        working-directory: weftbase
        run: make offline

  # The Console freshness gate: rebuild console/app with Bun, prove the
  # committed console/dist matches and fits the 800 KiB gzip budget, then
  # run the app's typecheck, lint, vocabulary audit and tests. Skipped
  # until console/app lands on the branch.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - id: app
        run: test -f weftbase/console/app/package.json && echo present=true >> "$GITHUB_OUTPUT" || echo present=false >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - if: steps.app.outputs.present == 'true'
        name: make console-check
        working-directory: weftbase
        run: make console-check
