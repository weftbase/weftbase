name: CI

# Every push to main and every pull request (whatever its base branch),
# plus a manual run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The committed go.work joins the server module and the client module;
# weft comes from the module proxy at the version both go.mod files
# require (no checkout of weft's main beside this repository).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
      - name: build (both modules)
        working-directory: weftbase
        run: make build
      - name: vet (both modules)
        working-directory: weftbase
        run: make vet
      - name: test (both modules)
        working-directory: weftbase
        run: make test

  # The layering check, the client module's dependency allow-list and
  # the Go vocabulary audit (docs/architecture.md). Each fails on its
  # own seeded violation in scripts/layering's tests.
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
      - name: layering
        working-directory: weftbase
        run: make layering
      - name: client module dependencies
        working-directory: weftbase
        run: make client-deps
      - name: vocabulary
        working-directory: weftbase
        run: make vocab
      - name: layering check's own tests
        working-directory: weftbase
        run: go test ./scripts/layering/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
      # Pinned as weft's lint job pins it.
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
      - name: lint
        working-directory: weftbase
        run: make lint

  # The DSN-gated suites (make clickhouse): every package with a
  # ClickHouse half (obsdb and its backends, api/http/v1, observe/ingest)
  # against a ClickHouse service container; each test creates and drops
  # its own database. A gated test that skips fails the job: a DSN the
  # tests cannot read must not turn it green.
  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_PASSWORD: weft
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password weft --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEFT_CLICKHOUSE_DSN: clickhouse://default:weft@127.0.0.1:9000/default
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
      - name: make clickhouse
        working-directory: weftbase
        run: make clickhouse CLICKHOUSE_LOG="$RUNNER_TEMP/clickhouse.log"

  # The release's build without the workspace (make gowork-off):
  # GOWORK=off, the client placeholder pointed at ./client as requiring
  # the tagged client module will, and the client module tidy alone.
  gowork-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
      - name: make gowork-off
        working-directory: weftbase
        run: make gowork-off

  # The offline gate: both modules stay green under
  # WEFT_MODEL_REQUESTS=deny.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            weftbase/go.sum
            weftbase/client/go.sum
      - name: test (WEFT_MODEL_REQUESTS=deny)
        working-directory: weftbase
        run: make offline

  # The Console gate (make console-check): the app's typecheck, lint,
  # tests, vocabulary audit, formatting and size budget, on a fresh Bun
  # build that must equal the committed console/dist.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: weftbase
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: make console-check
        working-directory: weftbase
        run: make console-check
