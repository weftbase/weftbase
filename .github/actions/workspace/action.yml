# The development workspace CI builds in: weftbase imports the weft
# framework (github.com/weftbase/weft and .../core), which has no tag
# under that path yet, so the go.mod files require it at the placeholder
# pseudo-version. This action checks weft's main out beside this
# repository (./weft next to ./weftbase); the repository's committed
# go.work joins the server module, the client module and ../weft. Once
# the two-phase release tags weft, drop it: the go.mod files then
# require the tag and the module proxy serves it.
name: workspace
description: check out weft beside weftbase for the committed go.work
inputs:
  token:
    description: a token that can read weftbase/weft (the default token reads a public repository)
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: weftbase/weft
        ref: main
        path: weft
        token: ${{ inputs.token }}
